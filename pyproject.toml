[project]
name = "cp-book"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "competitive-verifier",
    "cpp-bundle; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
# coverage CI: gcovr + tree-sitter for scripts/coverage_fill_missing.py
coverage = ["gcovr", "tree-sitter", "tree-sitter-cpp"]

[tool.uv]
package = false
# scripts/*.py run via `#!/usr/bin/env -S uv run` from any cwd, which needs
# script-relative project discovery (uv 0.12+).
required-version = ">=0.12"

[tool.uv.sources]
# Fork with cp-book integration patches; uv.lock pins the commit.
competitive-verifier = { git = "https://github.com/ecnerwala/competitive-verifier.git", branch = "cp-book-integration" }
# cpp-bundle / cpp-minify binaries for scripts/bundle.py (Linux x86_64 wheel from the GitHub release).
cpp-bundle = { url = "https://github.com/ecnerwala/cpp-bundle/releases/download/v0.1.0/cpp_bundle-0.1.0-py3-none-manylinux_2_34_x86_64.whl" }
